
  spring:
    application:
      name: cafe-qr-backend

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/cafe_ordering}
      username: ${POSTGRES_USER:cafe_user}
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver

    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

    # Photo uploads (menu items / categories). Photos are resized in the
    # browser first, so 5 MB is plenty.
    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 6MB

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  server:
    port: 8080
    forward-headers-strategy: native


  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}


  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000


  twofactor:
    api-key: ${TWOFACTOR_API_KEY:}
    sms-header: ${TWOFACTOR_SMS_HEADER:}



  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    template-name: ${WHATSAPP_TEMPLATE_NAME:}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}


  web-push:
    # Optional. Leave empty to disable Web Push (ordering still works).
    vapid-public-key: BPWMFAZUXu5baPGIZpT62vdi8ANNon3EtgD4K0GvZ8A1PMt-r_9FbX4PjcTeWi0Ikudz_VGX0026gkNkm5K7vPs
    vapid-private-key: Y_sShYgceod FDY_boxC61wHBJrvhOfRbmNnr_QLBAS
    vapid-subject: app.rushhourscafe.in



  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Vendor configuration per client: SMALL_CAFE | LARGE_CAFE | RESTAURANT
    business-type: ${BUSINESS_TYPE:SMALL_CAFE}
    # Shown in browser notifications
    cafe-name: ${CAFE_NAME:Rush Hours}
    # Public address of this backend (used for photo URLs in local storage mode)
    public-backend-url: ${BACKEND_PUBLIC_URL:http://localhost:8080}
    # Where menu/category photos are stored: local | s3 | cloudinary
    storage:
      provider: ${STORAGE_PROVIDER:local}
      local-dir: ${STORAGE_LOCAL_DIR:uploads}
      s3:
        bucket: ${S3_BUCKET:}
        region: ${S3_REGION:ap-south-1}
        access-key: ${S3_ACCESS_KEY:}
        secret-key: ${S3_SECRET_KEY:}
        endpoint: ${S3_ENDPOINT:}
        public-base-url: ${S3_PUBLIC_BASE_URL:}
      cloudinary:
        cloud-name: ${CLOUDINARY_CLOUD_NAME:}
        api-key: ${CLOUDINARY_API_KEY:}
        api-secret: ${CLOUDINARY_API_SECRET:}
        folder: ${CLOUDINARY_FOLDER:rushhour}
